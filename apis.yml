name: Pop.in
description: Pop.in is a consumer social gaming platform that connects people through
  real-time multiplayer games including Spades, Hearts, Dominoes, Liar's Dice, crosswords,
  Pop Quiz trivia, and Just Chatting. Delivered as iOS and Android apps plus a web
  play surface at play.pop.in, the service reports over 100M downloads and 20M active
  users with a 4.75+ average rating. The company is backed by 500 Global and was surfaced
  through its portfolio; it operates a purely consumer-facing product and publishes
  no public developer, API, or documentation surface at this time.
